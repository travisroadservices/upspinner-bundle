name: Test

on: [push]

jobs:
  build-test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.*']

    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Install dependencies
        run: composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Show installed Symfony version
        run: composer show symfony/http-kernel | grep versions

      - name: PHP CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit
